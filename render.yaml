services:
  - type: web
    name: hacktoberfest-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CRITIC_PROVIDER
        sync: false
      - key: DAILY_TOKEN_QUOTA
        sync: false
      - key: DEFAULT_PLANNER_PROVIDER
        sync: false
      - key: ENABLE_CACHE
        sync: false
      - key: ENABLE_CIRCUIT_BREAKER
        sync: false
      - key: ENVIRONMENT
        sync: false
      - key: FALLBACK_PLANNER_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HOST
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: MAX_REQUESTS_PER_MINUTE
        sync: false
      - key: MOCK_LLM_MODE
        sync: false
      - key: PORT
        sync: false

  - type: web
    name: hacktoberfest-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
